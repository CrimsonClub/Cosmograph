name: Cosmograph
version: '${version}'
main: dev.noellx.cosmograph.Cosmograph
api-version: '${apiVersion}'
folia-supported: true
authors: [Ayont, Veylor-Development, Noellx, Nullifidev]
depend: [LuckPerms]
softdepend: [PlaceholderAPI]
description: Noellx Private Message Formatter (LPC)
website: https://modrinth.com/plugin/lpc-chat
commands:
  cosmograph:
    description: Cosmograph chat formatter commands.
    usage: "Usage: /cosmograph <reload|version|help>"
  msg:
    description: Send a formatted private message.
    usage: "Usage: /msg <player> <message>"
    aliases: [tell, whisper]
  r:
    description: Reply to the last private message.
    usage: "Usage: /r <message>"
    aliases: [reply]
permissions:
  cosmograph.reload:
    description: Allows reloading the Cosmograph configuration.
    default: op
  cosmograph.chatcolor:
    description: Allows using colour codes and cosmetic MiniMessage tags in chat.
    default: false
  cosmograph.itemplaceholder:
    description: Allows using the [item] placeholder in chat. Ops get this by default; grant it to a group (e.g. /lp group default permission set cosmograph.itemplaceholder true) to enable for everyone.
    default: op
  cosmograph.emoji:
    description: Use emoji shortcuts in chat (only enforced when emoji.require-permission is true).
    default: true
  cosmograph.chatlinks:
    description: Have URLs in your messages turned into clickable links.
    default: true
  cosmograph.mention.exempt:
    description: Opt out of receiving mention pings.
    default: false
name: Maven publish

on:
  release:
    types: [ created ]

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Get commit hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
      - name: Set version
        env:
          RELEASE_NAME: ${{ github.event.release.name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="$RELEASE_NAME"
          if [ "$IS_PRERELEASE" = "true" ]; then
            FULL_VERSION="${VERSION}-commit-${COMMIT_HASH}"
            echo "VERSION_TYPE=beta" >> "$GITHUB_ENV"
          else
            FULL_VERSION="${VERSION}"
            echo "VERSION_TYPE=release" >> "$GITHUB_ENV"
          fi
          echo "Setting version to $FULL_VERSION"
          sed -i "s#<version>[^<]*</version>#<version>${FULL_VERSION}</version>#" pom.xml
          echo "FULL_VERSION=$FULL_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build jar
        run: mvn -B clean package
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/Cosmograph-*.jar
          fail_on_unmatched_files: true
